name: xlstm_env
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.12
  # Scientific Stack (Conda-Forge)
  - numpy=1.26.4
  - pandas=3.0.1
  - scipy=1.17.1
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - scikit-learn
  - sympy=1.14.0
  - tqdm=4.67.3
  - pyyaml=6.0.3
  - pillow=12.1.1
  # Seismic and Optimization
  - obspy=1.5.0
  - optuna
  - captum=0.7.0
  # Jupyter and Tooling
  - ipykernel=7.2.0
  - ipython=9.11.0
  - psutil=7.2.2
  - sqlalchemy=2.0.48
  - requests=2.32.5
  # PyTorch and GPU (PyTorch/Nvidia Channels)
  - pytorch=2.1.0 # Standard stable versioning for conda
  - cuda-toolkit=13.0.2
  - nvidia-cudnn-cu13
  - nvidia-nccl-cu13
  # Pip for niche or research-specific libraries
  - pip:
    - xlstm==2.0.5
    - mlstm_kernels==2.0.2
    - dacite==1.9.2
    - einops==0.8.2
    - torchinfo==1.8.0
    - torchsummary==1.5.1
    - ftfy==6.3.1
    - hf-xet==1.4.2
    - transformers==5.3.0
    - omegaconf==2.3.0
    - annotated-doc==0.0.4
    - antlr4-python3-runtime==4.9.3
    - joypy==0.2.6
